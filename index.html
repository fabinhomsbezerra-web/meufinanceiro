<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MeuFinanceiro — Controle Financeiro Pessoal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b1120; --bg2:#0e1526; --card:#131b2e; --card2:#171f34; --border:rgba(255,255,255,.07);
  --text:#e9edf5; --dim:#8a93a8; --dim2:#5c6579;
  --green:#22c55e; --green-d:rgba(34,197,94,.14);
  --red:#f5455c; --red-d:rgba(245,69,92,.14);
  --blue:#3b82f6; --blue-d:rgba(59,130,246,.14);
  --purple:#a78bfa; --purple-d:rgba(167,139,250,.14);
  --amber:#f59e0b; --amber-d:rgba(245,158,11,.14);
  --cyan:#22d3ee; --cyan-d:rgba(34,211,238,.14);
  --radius:18px; --radius-sm:12px;
  --shadow:0 8px 30px rgba(0,0,0,.25);
}
[data-theme="light"]{
  --bg:#f3f5fa; --bg2:#ffffff; --card:#ffffff; --card2:#f7f8fc; --border:rgba(15,23,42,.08);
  --text:#121826; --dim:#5c657a; --dim2:#8891a5;
  --shadow:0 8px 24px rgba(30,41,59,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; overflow-x:hidden;
}
button{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

#app{display:flex; min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:250px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--border);
  padding:22px 16px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px 8px;}
.brand-badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--green),#0ea86f);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-title{font-weight:700;font-size:16px;line-height:1.15;}
.brand-sub{font-size:11px;color:var(--dim);}
.nav{display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; cursor:pointer;
  color:var(--dim); font-size:14px; font-weight:500; border:none; background:none; width:100%; text-align:left;
}
.nav-item svg{flex-shrink:0;}
.nav-item:hover{background:var(--card);color:var(--text);}
.nav-item.active{background:var(--green-d); color:var(--green); font-weight:700;}
.nav-sep{height:1px;background:var(--border);margin:10px 4px;}
.sidebar-footer{display:flex;align-items:center;gap:10px;padding:12px 8px 0 8px;border-top:1px solid var(--border);margin-top:10px;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--green),#0ea86f);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#06210f;flex-shrink:0;}
.sf-name{font-size:13px;font-weight:600;}
.sf-mail{font-size:11px;color:var(--dim);}

/* ---------- MAIN ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:18px 26px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20;
}
.topbar-title{font-size:22px;font-weight:700;}
.topbar-sub{font-size:12.5px;color:var(--dim);margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);
}
.icon-btn:active{transform:scale(.94);}
.search-box{
  display:flex;align-items:center;gap:8px; background:var(--card); border:1px solid var(--border);
  border-radius:11px; padding:8px 12px; color:var(--dim); cursor:pointer; min-width:180px;
}
.content{padding:22px 26px 100px 26px; flex:1;}
@media (max-width:767px){ .content{padding:16px 14px 96px 14px;} .topbar{padding:14px 16px;} }

/* ---------- GRID / CARDS ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px;}
.grid-3{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px;}
.grid-2col{display:grid; grid-template-columns:2fr 1fr; gap:14px;}
@media (max-width:900px){ .grid-2col{grid-template-columns:1fr;} }
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px;
}
.card h3{margin:0 0 4px 0; font-size:14px; color:var(--dim); font-weight:600;}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-hd .title{font-size:15px;font-weight:700;}
.link-btn{font-size:12.5px;color:var(--green);font-weight:600;cursor:pointer;background:none;border:none;}
.big-num{font-size:28px;font-weight:800;letter-spacing:-.4px;}
.delta{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px;margin-top:4px;}
.delta.up{color:var(--green);} .delta.down{color:var(--red);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.pill.green{background:var(--green-d);color:var(--green);}
.pill.red{background:var(--red-d);color:var(--red);}
.pill.amber{background:var(--amber-d);color:var(--amber);}
.pill.blue{background:var(--blue-d);color:var(--blue);}
.pill.purple{background:var(--purple-d);color:var(--purple);}
.pill.gray{background:var(--card2);color:var(--dim);}
.iconbox{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.row{display:flex;align-items:center;gap:12px;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.li-title{font-size:13.5px;font-weight:600;}
.li-sub{font-size:11.5px;color:var(--dim);margin-top:1px;}
.li-value{font-size:13.5px;font-weight:700;text-align:right;}
.progress{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;}
.progress > div{height:100%;border-radius:6px;}
.tabs{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:11px;width:fit-content;}
.tab{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--dim);border:none;background:none;}
.tab.active{background:var(--green);color:#06210f;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.chip{padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--dim);cursor:pointer;}
.chip.active{background:var(--green);color:#06210f;border-color:var(--green);}
.section-title{font-size:16px;font-weight:700;margin:22px 0 12px 0;}
.section-title:first-child{margin-top:0;}
.btn{padding:11px 16px;border-radius:12px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
.btn-green{background:var(--green);color:#06210f;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-red{background:var(--red);color:#fff;}
.btn-block{width:100%;}
.btn:active{transform:scale(.98);}
.empty{text-align:center;padding:30px 10px;color:var(--dim);font-size:13px;}

/* ---------- CREDIT CARD VISUAL ---------- */
.ccard{border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;}
.ccard::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);}
.ccard::before{content:"";position:absolute;left:-20px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.12);}
.ccard-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.ccard-bank{font-weight:800;font-size:15px;letter-spacing:.3px;}
.ccard-sub{font-size:11px;opacity:.85;}
.ccard-mid{position:relative;z-index:1;}
.ccard-num{font-size:13px;letter-spacing:2px;opacity:.9;margin:10px 0;}
.ccard-bottom{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;}
.ccard .cprog{height:6px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:10px;}
.ccard .cprog>div{height:100%;background:#fff;border-radius:6px;}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{display:none;}
@media (max-width:767px){
  .bottomnav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--bg2); border-top:1px solid var(--border);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom)) 4px; z-index:30;
  }
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:10.5px;font-weight:600;background:none;border:none;padding:4px;}
  .bn-item.active{color:var(--green);}
}
.fab{
  position:fixed; right:20px; bottom:88px; width:56px;height:56px;border-radius:50%;
  background:var(--green); color:#06210f; display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(34,197,94,.4); border:none; cursor:pointer; z-index:35;
}
@media (min-width:768px){ .fab{bottom:26px; right:30px;} }

/* ---------- MODAL / SHEET ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
@media (min-width:640px){ .overlay{align-items:center;} }
.sheet{
  background:var(--bg2); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px;
  max-height:86vh; overflow-y:auto; border:1px solid var(--border);
}
@media (min-width:640px){ .sheet{border-radius:20px;} }
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-hd h2{font-size:17px;margin:0;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--border); background:var(--card);
  color:var(--text); font-size:14px; font-family:inherit;
}
.field input:focus, .field select:focus{outline:2px solid var(--green); outline-offset:1px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quick-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:14px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12.5px;font-weight:700;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#06210f;padding:11px 20px;border-radius:12px;font-weight:700;font-size:13px;z-index:80;box-shadow:var(--shadow);}
.search-results{margin-top:14px;display:flex;flex-direction:column;gap:2px;}
.search-result-item{display:flex;align-items:center;gap:11px;padding:10px 6px;border-radius:10px;cursor:pointer;}
.search-result-item:hover{background:var(--card);}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;}
.cal-dow{font-size:10.5px;color:var(--dim);font-weight:700;padding-bottom:6px;}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:1px solid transparent;position:relative;}
.cal-day.muted{color:var(--dim2);}
.cal-day.today{border-color:var(--green);font-weight:800;}
.cal-day.selected{background:var(--green);color:#06210f;font-weight:800;}
.cal-dot{width:5px;height:5px;border-radius:50%;position:absolute;bottom:5px;}

.insight-card{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--card2);margin-bottom:10px;align-items:flex-start;}
.insight-text{font-size:13px;line-height:1.5;}
.badge-num{font-size:11px;font-weight:800;color:var(--green);}

hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.muted{color:var(--dim);}
.small{font-size:12px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>
<script>
/* ================= ICONS ================= */
const ICON = {
  home:`<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/>`,
  income:`<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>`,

  more:`<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>`,
  search:`<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>`,
  plus:`<path d="M12 5v14M5 12h14"/>`,
  x:`<path d="m6 6 12 12M18 6 6 18"/>`,
  chevron:`<path d="m9 6 6 6-6 6"/>`,
  moon:`<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>`,

  trash:`<path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7 7.3 20a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/>`,
  bell:`<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/>`,
  target:`<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>`,
  snow:`<path d="M12 2v20M4.9 6.5l14.2 11M4.9 17.5l14.2-11"/>`,

function icon(name, size=18, stroke=2){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||''}</svg>`;
}

/* ================= UTILS ================= */
const fmt = n => (n<0?'-':'')+'R$ '+Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct1 = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const uid = () => Math.random().toString(36).slice(2,10);
const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const todayStr = () => new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

    {id:uid(), desc:'Rendimentos', valor:250, data:'2026-09-20', categoria:'Rendimentos', conta:'Investimentos — Carteira Diversificada', recorrencia:'Mensal', status:'Prevista'},
    {id:uid(), desc:'Venda MercadoLivre', valor:1000, data:'2026-09-28', categoria:'Vendas', conta:'Conta Corrente Itaú', recorrencia:'Eventual', status:'Prevista'},
  ],
  incomesPrevMonth:8320,
  expenses:[
    {id:uid(), desc:'Aluguel', valor:1450, data:'2026-09-05', categoria:'Moradia', conta:'Conta Corrente Itaú', forma:'Débito automático', status:'Paga'},
    {id:uid(), desc:'Supermercado', valor:620, data:'2026-09-08', categoria:'Alimentação', conta:'Nubank Digital', forma:'Cartão de débito', status:'Paga'},

const STORAGE_KEY = 'meufinanceiro_db_v1';
function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(err){ console.warn('Não foi possível salvar os dados localmente:', err); }
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const saved = JSON.parse(raw); DB = Object.assign({}, DB, saved); }
  }catch(err){ console.warn('Não foi possível carregar os dados salvos:', err); }
}

/* ================= COMPUTED HELPERS ================= */
function totalAccounts(){ return DB.accounts.reduce((a,c)=>a+c.balance,0); }
function totalInvestimentos(){ return DB.accounts.filter(a=>a.type==='Investimentos').reduce((a,c)=>a+c.balance,0); }
function totalAtivos(){ return totalAccounts(); }
function totalIncomeMonth(){ return DB.incomes.reduce((a,c)=>a+c.valor,0); }
function totalIncomeRecebida(){ return DB.incomes.filter(i=>i.status==='Recebida').reduce((a,c)=>a+c.valor,0); }
function totalIncomePrevista(){ return DB.incomes.filter(i=>i.status==='Prevista').reduce((a,c)=>a+c.valor,0); }
function totalExpenseMonth(){ return DB.expenses.reduce((a,c)=>a+c.valor,0); }
function totalExpensePaga(){ return DB.expenses.filter(e=>e.status==='Paga').reduce((a,c)=>a+c.valor,0); }
function totalExpensePendente(){ return DB.expenses.filter(e=>e.status==='Pendente').reduce((a,c)=>a+c.valor,0); }
function totalDividas(){ return DB.debts.reduce((a,c)=>a+c.valorAtual,0); }
function totalDividasOriginal(){ return DB.debts.reduce((a,c)=>a+c.valorOriginal,0); }
function totalDividasPago(){ return totalDividasOriginal()-totalDividas(); }
function totalParcelaMensalDividas(){ return DB.debts.reduce((a,c)=>a+c.valorParcela,0); }
function totalCardUsed(){ return DB.cards.reduce((a,c)=>a+cardUsed(c),0); }
function totalCardLimit(){ return DB.cards.reduce((a,c)=>a+c.limite,0); }
function cardUsed(c){ const inv = c.invoices.find(i=>i.status!=='Paga')||c.invoices[c.invoices.length-1]; return c.compras.reduce((a,p)=>a + (p.valor/p.parcelas)*(p.parcelas-p.pagas),0); }
function cardCurrentInvoice(c){ return c.invoices.find(i=>i.status==='Aberta'||i.status==='Vencida') || c.invoices[1]; }
function totalFaturasAbertas(){ return DB.cards.reduce((a,c)=>{const inv=cardCurrentInvoice(c); return a+(inv?inv.total:0);},0); }
function categoryTotals(list, key='categoria'){
  const map = {};
  list.forEach(e=>{ map[e[key]] = (map[e[key]]||0)+e.valor; });
  return map;
}
function allInstallmentPurchases(){
  const out=[];
  DB.cards.forEach(c=>c.compras.forEach(p=>{ if(p.parcelas>1) out.push({...p, cardId:c.id, cardName:c.apelido}); }));
  return out;
}
function totalParcelasFuturas(){
  return allInstallmentPurchases().reduce((a,p)=>a + (p.valor/p.parcelas)*(p.parcelas-p.pagas),0);
}
function comprometimentoRenda(){ return (totalParcelaMensalDividas()/totalIncomeMonth())*100; }
function budgetSpent(cat){ return DB.expenses.filter(e=>e.categoria===cat).reduce((a,c)=>a+c.valor,0); }
function findCard(id){ return DB.cards.find(c=>c.id===id); }
function dateBR(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
function monthName(iso){ const d=new Date(iso+'T00:00:00'); return MONTHS[d.getMonth()]; }

  DB.expenses.filter(e=>e.status==='Pendente').forEach(e=>{ evs.push({title:e.desc, sub:e.categoria, value:e.valor, icon:'expense', color:'gray'.replace('gray','amber'), badge:'Pendente', sort:parseInt(dateBR(e.data))}); });

}

/* ================= CALENDÁRIO ================= */
function renderCalendar(){
  const now = new Date(); const y=now.getFullYear(), m=now.getMonth();
  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const eventsByDay = {};
  function addEv(day,ev){ (eventsByDay[day]=eventsByDay[day]||[]).push(ev); }
  DB.expenses.forEach(e=>{ const d=new Date(e.data+'T00:00:00'); if(d.getMonth()===m) addEv(d.getDate(),{type:'Despesa',color:'red',text:e.desc,value:e.valor}); });
  DB.incomes.forEach(i=>{ const d=new Date(i.data+'T00:00:00'); if(d.getMonth()===m) addEv(d.getDate(),{type:'Receita',color:'green',text:i.desc,value:i.valor}); });
  DB.cards.forEach(c=>{ addEv(c.vencimento,{type:'Fatura',color:'blue',text:'Fatura '+c.apelido,value:cardCurrentInvoice(c).total}); });
  DB.debts.forEach(d=>{ addEv(parseInt(d.vencimento),{type:'Dívida',color:'amber',text:d.credor,value:d.valorParcela}); });

  const sel = S.calSelected || now.getDate();
  let cells=''; 
  for(let i=0;i<firstDow;i++) cells+=`<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = d===now.getDate();
    const has = eventsByDay[d];
    cells += `<div class="cal-day ${isToday?'today':''} ${sel===d?'selected':''}" data-action="cal-select" data-day="${d}">
      ${d}${has?`<span class="cal-dot" style="background:var(--${has[0].color})"></span>`:''}
    </div>`;
  }
  const dayEvents = eventsByDay[sel]||[];
  return `
  <div class="grid-2col">
    <div class="card">
      <div class="card-hd"><span class="title">${MONTHS[m]} de ${y}</span></div>
      <div class="cal-grid">
        ${['D','S','T','Q','Q','S','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="title">Dia ${sel} de ${MONTHS[m]}</span></div>
      ${dayEvents.length? dayEvents.map(ev=>`
        <div class="list-item">
          <div class="iconbox" style="background:var(--${ev.color}-d);color:var(--${ev.color});">${icon(ev.type==='Fatura'?'card':ev.type==='Dívida'?'debt':ev.type==='Receita'?'income':'expense',16)}</div>
          <div style="flex:1"><div class="li-title">${ev.text}</div><div class="li-sub">${ev.type}</div></div>
          <div class="li-value">${fmt(ev.value)}</div>
        </div>`).join('') : `<div class="empty">Nenhum lançamento neste dia.</div>`}
    </div>
  </div>`;
}

/* ================= INSIGHTS (ANÁLISE FINANCEIRA) ================= */
function renderInsights(){
  const despAtual = totalExpenseMonth(), despAnterior = DB.monthlyFlow[7].desp;
  const varDesp = chg(despAtual, despAnterior);
  const cardsSorted = DB.cards.map(c=>({c, p:(cardUsed(c)/c.limite)*100})).sort((a,b)=>b.p-a.p);
  const maxCard = cardsSorted[0];
  const parcFut = totalParcelasFuturas();
  const compromRenda = comprometimentoRenda();
  const catAtual = categoryTotals(DB.expenses);
  let maiorAumentoCat=null, maiorAumentoVal=-Infinity;
  Object.keys(catAtual).forEach(k=>{
    const prev = DB.expensesPrevMonth[k]||0; const diff = catAtual[k]-prev;
    if(diff>maiorAumentoVal){ maiorAumentoVal=diff; maiorAumentoCat=k; }
  });

  const insights = [
    {icon:'chart', color: varDesp>0?'red':'green', text:`Suas despesas ${varDesp>0?'aumentaram':'diminuíram'} ${pct1(Math.abs(varDesp))} este mês em relação ao anterior.`},
    {icon:'card', color: maxCard.p>80?'red':'blue', text:`Seu cartão ${maxCard.c.apelido} está utilizando ${maxCard.p.toFixed(0)}% do limite disponível.`},
    {icon:'layers', color:'amber', text:`Você possui ${fmt(parcFut)} em parcelas futuras já comprometidas nas próximas faturas.`},
    {icon:'debt', color: compromRenda>40?'red':'green', text:`Suas dívidas comprometem ${pct1(compromRenda)} da sua renda mensal.`},
    {icon:'expense', color:'amber', text:`Você gastou ${fmt(Math.abs(maiorAumentoVal))} a ${maiorAumentoVal>=0?'mais':'menos'} com ${maiorAumentoCat} neste mês em relação ao anterior.`},
  ];
  const recs = [];
  if(maxCard.p>80) recs.push(`Considere pagar parte da fatura do ${maxCard.c.apelido} antecipadamente para liberar limite e evitar juros rotativos.`);
  if(compromRenda>40) recs.push('Suas dívidas ultrapassam o recomendado (até 30% da renda). Avalie o Plano de Quitação para reorganizar os pagamentos.');
  DB.budgets.forEach(b=>{ if(budgetSpent(b.categoria)>b.limite) recs.push(`O orçamento de ${b.categoria} foi ultrapassado — revise os gastos nessa categoria.`); });
  if(recs.length===0) recs.push('Sua situação financeira está equilibrada. Continue acompanhando os gastos mensalmente.');

  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="card-hd"><span class="title">${icon('brain',16)} O que os seus dados dizem</span></div>
    ${insights.map(i=>`<div class="insight-card"><div class="iconbox" style="background:var(--${i.color}-d);color:var(--${i.color});">${icon(i.icon,17)}</div><div class="insight-text">${i.text}</div></div>`).join('')}
  </div>
  <div class="card">
    <div class="card-hd"><span class="title">Recomendações</span></div>
    ${recs.map(r=>`<div class="list-item"><div class="iconbox" style="background:var(--green-d);color:var(--green);">${icon('check',15)}</div><div class="li-title" style="font-weight:500;">${r}</div></div>`).join('')}
  </div>`;
}

function mkChart(id, config){ const el=document.getElementById(id); if(!el) return; CHARTS[id]=new Chart(el, config); }

function initCharts(){
  destroyCharts();
  const flow = DB.monthlyFlow;

function doSearch(q){
  q=q.trim().toLowerCase(); const box=document.getElementById('searchResults'); if(!q){ box.innerHTML=''; return; }
  const results=[];
  DB.incomes.forEach(i=>{ if(i.desc.toLowerCase().includes(q)) results.push({icon:'income',color:'green',title:i.desc,sub:'Receita · '+fmt(i.valor),view:'incomes'}); });
  DB.expenses.forEach(e=>{ if(e.desc.toLowerCase().includes(q)||e.categoria.toLowerCase().includes(q)) results.push({icon:'expense',color:'red',title:e.desc,sub:'Despesa · '+fmt(e.valor),view:'expenses'}); });
  DB.cards.forEach(c=>{ if((c.apelido+c.banco).toLowerCase().includes(q)) results.push({icon:'card',color:'blue',title:c.apelido,sub:'Cartão · '+c.banco,view:'cardDetail',cardId:c.id});
    c.compras.forEach(p=>{ if(p.desc.toLowerCase().includes(q)) results.push({icon:'layers',color:'purple',title:p.desc,sub:'Compra em '+c.apelido+' · '+fmt(p.valor),view:'cardDetail',cardId:c.id}); }); });
  DB.debts.forEach(d=>{ if(d.credor.toLowerCase().includes(q)) results.push({icon:'debt',color:'amber',title:d.credor,sub:'Dívida · '+fmt(d.valorAtual),view:'debts'}); });
  box.innerHTML = results.length ? results.map(r=>`<div class="search-result-item" data-action="search-goto" data-view="${r.view}" ${r.cardId?`data-cardid="${r.cardId}"`:''}>
      <div class="iconbox" style="background:var(--${r.color}-d);color:var(--${r.color});">${icon(r.icon,16)}</div>
      <div><div class="li-title">${r.title}</div><div class="li-sub">${r.sub}</div></div>
    </div>`).join('') : `<div class="empty">Nenhum resultado para "${q}"</div>`;
}

function saveForm(type, cardid){
  const val = id => { const el=document.getElementById(id); return el?el.value:''; };
  if(type==='income'){
    DB.incomes.push({id:uid(), desc:val('f_desc')||'Receita', valor:parseFloat(val('f_valor'))||0, data:val('f_data'), categoria:val('f_cat'), conta:val('f_conta'), recorrencia:val('f_rec'), status:val('f_status')});
  } else if(type==='expense'){
    DB.expenses.push({id:uid(), desc:val('f_desc')||'Despesa', valor:parseFloat(val('f_valor'))||0, data:val('f_data'), categoria:val('f_cat'), conta:val('f_conta'), forma:val('f_forma'), status:val('f_status')});
  } else if(type==='debt'){
    const parcela = parseFloat(val('f_parcela'))||0;
    DB.debts.push({id:uid(), credor:val('f_desc')||'Dívida', tipo:val('f_tipo'), valorOriginal:parseFloat(val('f_valor'))||0, valorAtual:parseFloat(val('f_valor'))||0, juros:parseFloat(val('f_juros'))||0, parcelas:parseInt(val('f_parcelas'))||1, pagas:0, valorParcela:parcela, vencimento:val('f_venc')||'—', status:'Ativa'});
  } else if(type==='card'){
    const colors=['linear-gradient(135deg,#22c55e,#065f46)','linear-gradient(135deg,#3b82f6,#1e3a8a)','linear-gradient(135deg,#ec4899,#831843)','linear-gradient(135deg,#eab308,#78350f)'];
    DB.cards.push({id:uid(), nome:val('f_desc'), banco:val('f_banco')||'Banco', apelido:val('f_desc')||'Cartão', ultimos4:val('f_last4')||'0000', limite:parseFloat(val('f_valor'))||1000, fechamento:parseInt(val('f_fech'))||5, vencimento:parseInt(val('f_venc'))||12, cor:colors[DB.cards.length%colors.length], contaPagamento:val('f_conta'), ativo:true, compras:[], invoices:[{id:uid(),label:'Set/2026 (atual)',status:'Aberta',total:0,paga:0,fechamento:'--/09',vencimento:'--/09'}]});
  } else if(type==='account'){
    DB.accounts.push({id:uid(), name:val('f_desc')||'Nova conta', type:val('f_tipo'), balance:parseFloat(val('f_valor'))||0});
  } else if(type==='purchase'){
    const c = findCard(cardid); if(c){ c.compras.push({id:uid(), desc:val('f_desc')||'Compra', valor:parseFloat(val('f_valor'))||0, data:val('f_data'), categoria:val('f_cat'), parcelas:parseInt(val('f_parcelas'))||1, pagas:0}); }
  }
  closeOverlay();
  showToast('Lançamento salvo com sucesso!');
  render();
}

function showToast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

/* ================= EVENT DELEGATION ================= */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='nav'){ S.view = el.dataset.view; if(el.dataset.cardid) S.cardDetail = el.dataset.cardid; window.scrollTo(0,0); render(); }
  else if(action==='nav-close'){ S.view = el.dataset.view; closeOverlay(); render(); }
  else if(action==='toggle-theme'){ DB.theme = DB.theme==='dark'?'light':'dark'; render(); }
  else if(action==='open-quickadd'){ openQuickAdd(); }
  else if(action==='open-search'){ openSearch(); }
  else if(action==='close-overlay'){ closeOverlay(); }
  else if(action==='quickadd-type'){ openForm(el.dataset.type, {cardid:el.dataset.cardid}); }
  else if(action==='save-form'){ saveForm(el.dataset.type, el.dataset.cardid); }
  else if(action==='search-goto'){ S.view=el.dataset.view; if(el.dataset.cardid) S.cardDetail=el.dataset.cardid; closeOverlay(); render(); }
  else if(action==='delete-income'){ DB.incomes = DB.incomes.filter(i=>i.id!==el.dataset.id); render(); showToast('Receita removida'); }
  else if(action==='delete-expense'){ DB.expenses = DB.expenses.filter(i=>i.id!==el.dataset.id); render(); showToast('Despesa removida'); }
  else if(action==='delete-debt'){ DB.debts = DB.debts.filter(i=>i.id!==el.dataset.id); render(); showToast('Dívida removida'); }
  else if(action==='delete-account'){ DB.accounts = DB.accounts.filter(i=>i.id!==el.dataset.id); render(); showToast('Conta removida'); }
  else if(action==='set-payoff'){ S.payoffMethod = el.dataset.method; render(); }
  else if(action==='set-filter'){ S.filter = el.dataset.filter; render(); showToast('Filtro aplicado: '+el.dataset.filter); }
  else if(action==='export'){ showToast((el.dataset.fmt)+' gerado com sucesso!'); }
  else if(action==='cal-select'){ S.calSelected = parseInt(el.dataset.day); render(); }
  else if(action==='add-budget'){ showToast('Escolha uma categoria na tela de Despesas para orçar'); }
  else if(action==='add-category'){ const name=prompt('Nome da nova categoria:'); if(name){ DB.customCategories.push(name); CAT_COLOR[name]='#'+Math.floor(Math.random()*16777215).toString(16); render(); showToast('Categoria criada'); } }
  else if(action==='open-transfer'){ showToast('Transferência entre contas simulada com sucesso!'); }
  else if(action==='reset-data'){ if(confirm('Isso vai apagar todos os seus lançamentos e restaurar os dados de demonstração. Continuar?')){ try{ localStorage.removeItem(STORAGE_KEY); }catch(err){} location.reload(); } }
});

function afterRenderHooks(){
  if(['dashboard','reports'].includes(S.view)) initCharts();
  else if(S.view==='expenses') initCharts();
  else destroyCharts();
}

render();
</script>
</body>
</html>
